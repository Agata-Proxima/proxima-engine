name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test engine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proxima
          POSTGRES_PASSWORD: proxima-dev-only
          POSTGRES_DB: proxima_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxima -d proxima_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Test public Engine CLI
        run: python3 -m unittest discover -s tests_cli -v
      - name: Run engine tests
        run: cargo test -p proxima-engine
      - name: Build release engine
        run: cargo build -p proxima-engine --release
      - name: Install PostgreSQL client for acceptance test
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify two-tenant isolation against PostgreSQL
        run: bash scripts/test-two-tenants.sh
      - name: Build container image
        run: docker build -t proxima-engine:ci .
      - name: Verify local Compose, PgBouncer, and Engine SQL path
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -f compose.dev.yaml down -v' EXIT
          docker compose -f compose.dev.yaml up --build -d

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9090/healthz >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:9090/healthz
          docker compose -f compose.dev.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U proxima -d appdb \
            -c "CREATE TABLE quickstart_ci (message text NOT NULL); INSERT INTO quickstart_ci VALUES ('hello through Proxima');"

          result="$(docker compose -f compose.dev.yaml exec -T postgres psql -X -A -t -v ON_ERROR_STOP=1 \
            "host=engine port=6432 dbname=appdb user=proxima password=local-only-change-me sslmode=disable" \
            -c "SELECT message FROM quickstart_ci;")"

          test "$result" = "hello through Proxima"
          echo "PASS: Compose Engine -> PgBouncer transaction pool -> PostgreSQL SQL path"
