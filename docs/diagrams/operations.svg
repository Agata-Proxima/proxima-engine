<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img" aria-label="Operations troubleshooting"><title>Operations troubleshooting</title><rect width="100%" height="100%" fill="#f8fafc"/><text x="35" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Operations troubleshooting</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect x="35" y="90" width="290" height="68" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="180" y="127" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#172a44">Connection or health problem</text><rect x="360" y="90" width="290" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="505" y="127" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#172a44">Check health endpoint</text><rect x="685" y="90" width="290" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="830" y="127" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#172a44">Check process, bind address and logs</text><rect x="35" y="225" width="290" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="180" y="262" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#172a44">Check upstream PostgreSQL reachability</text><rect x="360" y="225" width="290" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="505" y="262" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#172a44">Check DNS, port, firewall and TLS</text><rect x="685" y="225" width="290" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="830" y="262" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#172a44">Check credentials, tenant token, role and </text><rect x="35" y="360" width="290" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="180" y="397" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#172a44">Inspect restricted metrics and sanitized l</text><rect x="360" y="360" width="290" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="505" y="397" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#172a44">Preserve evidence; never paste secrets int</text><path d="M505 158 L505 360" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/></svg>
