services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxima} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - proxima-postgres-data:/var/lib/postgresql/data
    networks:
      - proxima-local
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROXIMA_LISTEN_ADDR: 0.0.0.0:6432
      PROXIMA_UPSTREAM_ADDR: postgres:5432
      PROXIMA_TENANT_SIGNING_KEY: ${PROXIMA_TENANT_SIGNING_KEY:-}
      PROXIMA_MAX_CONNECTIONS: ${PROXIMA_MAX_CONNECTIONS:-128}
      PROXIMA_DASHBOARD_ENABLED: "true"
      PROXIMA_DASHBOARD_LISTEN_ADDR: 0.0.0.0:9080
      PROXIMA_METRICS_LISTEN_ADDR: 0.0.0.0:9090
    ports:
      - "127.0.0.1:6432:6432"
      - "127.0.0.1:9080:9080"
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - proxima-engine-data:/var/lib/proxima
    networks:
      - proxima-local
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  proxima-local:

volumes:
  proxima-postgres-data:
  proxima-engine-data:
